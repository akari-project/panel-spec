// 控制面与 node-agent 之间的传输信封。语义见 spec/20-node-protocol.md。
syntax = "proto3";

package node.v1;

import "node/v1/common.proto";
import "node/v1/messages.proto";

// 所有帧（WSS 二进制帧或长轮询请求体中的一项）都是一个 Frame。
// 握手完成前只允许 Hello；之后 payload 为会话密钥加密的 Envelope。
message Frame {
  oneof kind {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    // XChaCha20-Poly1305 密文，明文为序列化后的 Envelope。
    // 附加数据为 direction(1 字节) || seq(8 字节大端)。
    bytes sealed = 3;
  }
  uint64 seq = 4;
}

message Hello {
  string node_id = 1;
  int64 ts_ms = 2;
  bytes nonce = 3; // 16 字节随机数
  uint32 proto_version = 4;
  bytes ephemeral_pubkey = 5; // X25519
  Capabilities capabilities = 6;
  uint64 config_version = 7;
  // HMAC-SHA256(PSK, M)，M 为以下字段依次拼接（整数为大端定长，字符串与字节串前置 4 字节大端长度）：
  //   "node-hello-v1" | node_id | ts_ms(8) | nonce | proto_version(4) | ephemeral_pubkey
  //   | SHA-256(capabilities 的确定性序列化) | config_version(8)
  bytes mac = 8;
}

message HelloAck {
  bytes ephemeral_pubkey = 1;
  uint32 proto_version = 2;
  // HMAC-SHA256(PSK, "node-hello-ack-v1" | node_id | agent_pubkey | ephemeral_pubkey | proto_version(4) | sync_mode(4))
  bytes mac = 3;
  SyncMode sync_mode = 4;
}

message Capabilities {
  string agent_version = 1;
  KernelType kernel = 2; // 当前运行中的内核
  string kernel_version = 3; // 当前内核版本
  repeated Protocol protocols = 4; // 当前内核支持的协议（兼容字段，以 kernels 为准）
  DeployMode deploy_mode = 5;
  bool supports_quota_lease = 6;
  bool supports_speed_limit = 7;
  bool supports_routes = 8;
  // 本二进制内置的全部内核及各自支持的协议。控制面据此校验入站配置。
  repeated KernelSupport kernels = 9;
}

message KernelSupport {
  KernelType kernel = 1;
  string version = 2;
  repeated Protocol stable_protocols = 3;
  repeated Protocol experimental_protocols = 4; // 需控制面显式允许才下发
}

// 会话内的业务信封（加密后放入 Frame.sealed）。
message Envelope {
  uint64 ack = 1; // 已收到对端的最大连续 seq
  int64 ts_ms = 2;
  string idem_key = 3;
  oneof body {
    SyncFull sync_full = 10;
    SyncDelta sync_delta = 11;
    CredUpsert cred_upsert = 12;
    CredRemove cred_remove = 13;
    QuotaLease quota_lease = 14;
    InboundApply inbound_apply = 15;
    RoutesApply routes_apply = 16;
    AgentUpgrade agent_upgrade = 17;
    ReportTraffic report_traffic = 30;
    ReportStatus report_status = 31;
    LeaseRequest lease_request = 32;
    Ack ack_only = 40;
  }
}

message Ack {}
