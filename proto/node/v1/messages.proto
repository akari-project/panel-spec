// SPDX-License-Identifier: Apache-2.0
// 节点协议的业务消息。语义见 spec/20、spec/21、spec/22。
//
// 带版本号的指令按 spec/20 NODE-23 应用：
//   - SyncFull：版本高于本地才应用；
//   - SyncDelta：to_version 不大于本地只确认；from_version 等于本地才应用，本地前进到 to_version；
//     其余情况（含本地落在 from_version 与 to_version 之间）不做部分应用，请求全量同步；
//   - 其他指令（CredUpsert、CredRemove、InboundApply、RoutesApply）：等于本地 + 1 才应用；
//     不大于本地只确认；跳号则请求全量同步。
syntax = "proto3";

package node.v1;

import "node/v1/common.proto";

// 代理凭据。一条凭据施加于该节点的全部入站：凭据消息（Snapshot.credentials、SyncDelta、
// CredUpsert、CredRemove）不带入站 tag，Agent 把每条凭据加入节点上每个入站，移除时从每个入站移除
// 并关闭其全部连接。内核适配器接口中的入站 tag 参数只在 Agent 内部使用（spec/21 21.3）。
//
// 各协议使用的形式全部由控制面生成并下发，Agent 只做下列编码，不做任何派生，两个内核一致：
//   - UUID：secret 的 16 字节即 RFC 9562 UUID 的二进制形式（网络字节序）。
//   - uuid_text：该 UUID 的 RFC 9562 标准文本形式，即 32 个小写十六进制数字按 8-4-4-4-12
//     用连字符分隔，共 36 个 ASCII 字符，不带花括号或 urn:uuid: 前缀。
//   - VLESS、VMess：用户 id 填 uuid_text；VMess 的 alterId 为 0（AEAD）。
//   - Trojan、Hysteria2、AnyTLS：密码 = uuid_text。
//   - TUIC：uuid 填 uuid_text，密码 = uuid_text。
//   - Shadowsocks 非 2022 方式（aes-128-gcm、aes-256-gcm、chacha20-ietf-poly1305）：密码 = uuid_text。
//   - Shadowsocks 2022：用户密钥 = 标准 base64（RFC 4648 §4，带填充）编码的 ss2022_key_16
//     （2022-blake3-aes-128-gcm）或 ss2022_key_32（2022-blake3-aes-256-gcm）；
//     入站主密钥在 Inbound.settings_json 的 inbound_key 中。
// 校验：secret 长度不是 16 字节，或 ss2022_key_16、ss2022_key_32 为空或长度不是 16、32 字节时，Agent 不把该凭据
// 加入任何入站，同一消息中的其他凭据照常应用，并在 ReportStatus.kernel_error 中报告该凭据的 id
// （格式见 ReportStatus.kernel_error，不含秘密值）。
// 控制面的生成规则（Agent 不需要实现，导出配置时 spec/23 使用同一规则）：
//   - secret 为 UUIDv4（RFC 9562 §5.4：122 位随机，版本与变体位已设置），创建凭据时生成，轮换时重新生成；
//   - ss2022_key_16 = HKDF-SHA256(ikm = secret, salt = 空（等价于 32 个零字节）, info = "akari-ss2022-user-key-16-v1", L = 16)；
//   - ss2022_key_32 = HKDF-SHA256(ikm = secret, salt = 空（等价于 32 个零字节）, info = "akari-ss2022-user-key-32-v1", L = 32)。
// 测试向量见 testdata/node-v1-vectors.json 的 credential。
message Credential {
  string id = 1; // proxy_credentials.id
  string account_id = 2; // 用于流量归属与租约
  // 16 字节，UUID 的二进制形式，各协议的用法见消息注释。节点本地保持加密形态（spec/21 AGT-05）
  bytes secret = 3;
  uint32 speed_limit_mbps = 4; // 0 表示不限
  int64 expires_at_ms = 5; // 本地兜底：到期自动移除，并关闭连接（spec/20 NODE-24）
  // 仅第三方共用凭据：活跃来源数上限，0 表示不限（spec/22 ACC-12，M4-06）。
  uint32 max_sources = 6;
  // Shadowsocks 2022 用户密钥的原始字节，长度分别为 16 与 32，由控制面按消息注释的规则生成，
  // 每条凭据都填写。节点本地与 secret 一样保持加密形态（spec/21 AGT-05）。
  bytes ss2022_key_16 = 7;
  bytes ss2022_key_32 = 8;
}

message Inbound {
  string tag = 1;
  Protocol protocol = 2;
  uint32 listen_port = 3;
  // 传输、TLS、Reality 等，结构见 schemas/inbound/<protocol>-<transport>.schema.json（spec/21 AGT-13）。
  bytes settings_json = 4;
  uint64 version = 5;
  Transport transport = 6;
}

// 离线行为参数（spec/22 ACC-19）。
message OfflinePolicy {
  uint64 offline_lease_bytes = 1; // 默认 64 MiB
  uint32 offline_max_seconds = 2; // 默认 86400
}

// 节点的完整配置状态。SyncFull 以序列化后的原始字节携带。
message Snapshot {
  uint64 config_version = 1;
  // 控制面为该节点选定的内核；与当前不同时 Agent 先切换内核再应用入站（spec/21 AGT-07）。
  KernelType kernel = 2;
  repeated Inbound inbounds = 3;
  repeated Credential credentials = 4; // 每条凭据施加于全部入站（见 Credential）
  bytes routes_json = 5;
  // 以 K_dns = HKDF-SHA256(ikm = PSK, salt = 空（等价于 32 个零字节）, info = "akari-dns-secret-v1", L = 32)
  // 做 XChaCha20-Poly1305 加密，附加数据为空：nonce(24) || 密文与 tag（spec/20 NODE-25）。
  // PSK 取当前会话通过验证的那一把；重新接入的过渡期结束、或 PSK 变化后，控制面用新 PSK 重新加密下发。
  bytes dns_provider_secret = 6;
  OfflinePolicy offline_policy = 7;
}

message SyncFull {
  reserved 1, 2, 3, 4, 6;
  reserved "config_version", "inbounds", "credentials", "routes_json", "kernel";

  bytes checksum = 5; // SHA-256(snapshot)，覆盖原始字节
  bytes snapshot = 7; // 序列化后的 Snapshot；Agent 校验后原子替换本地快照（spec/20 NODE-15）
}

// 只能表达凭据变化；中间变更含非凭据变化时必须发 SyncFull（spec/20 NODE-15）。
// 应用条件见文件头（spec/20 NODE-23）：from_version 等于本地才应用。
message SyncDelta {
  uint64 from_version = 1;
  uint64 to_version = 2;
  repeated Credential upserts = 3;
  repeated string removals = 4; // 移除即关闭连接
}

message CredUpsert {
  uint64 config_version = 1;
  repeated Credential credentials = 2;
}

// 移除一律在 1 秒内关闭该凭据的全部连接，没有“移除但不关闭”的选项（spec/20 NODE-24）。
message CredRemove {
  reserved 3;
  reserved "close_sessions";

  uint64 config_version = 1;
  repeated string credential_ids = 2;
}

message QuotaLease {
  string account_id = 1;
  int64 bytes = 2; // 正数发放，0 表示回收全部
  string lease_id = 3;
  int64 expires_at_ms = 4; // 默认 10 分钟（spec/22 ACC-08）
}

// 首次申请、续租与释放（spec/22 ACC-08、ACC-10）。以 (account_id, current_lease_id, is_release) 幂等。
// 释放必须引用该节点上最新的 lease_id；控制面结算后回复 QuotaLease{bytes = 0}。
message LeaseRequest {
  string account_id = 1;
  string current_lease_id = 2; // 首次申请时为空
  int64 remaining_bytes = 3; // 旧租约的剩余字节，控制面据此结算
  // 账号在该节点的最后一条连接关闭时置为 true；控制面结算并释放，不再发放新租约。
  // 仅在控制面声明 supports_lease_release 时发送。
  bool is_release = 4;
}

// 该节点的全部入站，全量替换；只中断被修改或删除的入站上的连接（spec/21 AGT-07）。
message InboundApply {
  uint64 config_version = 1;
  repeated Inbound inbounds = 2;
  KernelType kernel = 3; // 同 Snapshot.kernel
}

message RoutesApply {
  uint64 config_version = 1;
  bytes routes_json = 2;
  bytes dns_provider_secret = 3; // 加密方式同 Snapshot.dns_provider_secret
}

message AgentUpgrade {
  string version = 1;
  string url = 2;
  bytes sha256 = 3;
  // Ed25519 签名，签名输入为 "akari-agent-upgrade-v1" | version | sha256（编码约定见 envelope.proto 文件头）。
  // 其中 sha256 为 32 字节字节串，与其他字节串一样按 “|” 规则前置 4 字节大端长度。
  // 签名把版本号与制品摘要绑定在一起（spec/40 DEP-09）；测试向量见 testdata/node-v1-vectors.json 的 agent_upgrade。
  bytes signature = 4;
  uint32 key_id = 5; // Agent 内置“当前”与“下一把”两个公钥，按 key_id 选择（spec/40 DEP-09）
}

// 第三方共用凭据的全局活跃来源集合，仅发给声明 supports_source_limit 的节点（spec/22 ACC-12，M4-06）。
message SourceSet {
  string credential_id = 1;
  repeated string prefixes = 2; // IPv4 为单个地址，IPv6 为 /64
  uint64 version = 3;
}

message TrafficItem {
  string credential_id = 1;
  uint64 raw_up = 2; // 客户端 → 节点的解密后代理载荷字节（spec/21 AGT-12）
  uint64 raw_down = 3; // 节点 → 客户端
  repeated string source_prefixes = 4; // 仅第三方共用凭据：活跃来源地址前缀
}

message ReportTraffic {
  // 同一 node_id 下严格递增，永不回退，跨重启与重装持续（spec/22 ACC-03）。
  uint64 report_seq = 1;
  int64 window_start_ms = 2;
  int64 window_end_ms = 3;
  repeated TrafficItem items = 4;
}

// 每 30 秒一次（spec/20 NODE-20）。
message ReportStatus {
  double cpu_percent = 1;
  uint64 mem_used_bytes = 2;
  uint64 mem_total_bytes = 3;
  uint32 tcp_connections = 4;
  uint64 rx_bps = 5;
  uint64 tx_bps = 6;
  uint64 uptime_seconds = 7;
  uint64 config_version = 8; // 已成功应用的版本
  repeated InboundHealth inbounds = 9;
  KernelType running_kernel = 10;
  // 最近一次内核切换或入站应用失败的原因，成功后清空。
  // 凭据校验失败（Credential 注释中的长度校验）也写入本字段，格式为 "credential <id>: invalid length"，
  // 多条以分号分隔，不含秘密值；某条凭据的错误只在该凭据被移除或被正确的值替换后才清空，
  // 其他内核或入站操作的成功不清空凭据错误。
  string kernel_error = 11;
}

message InboundHealth {
  string tag = 1;
  bool listening = 2;
  string error = 3;
}
