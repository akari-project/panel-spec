syntax = "proto3";

package node.v1;

import "node/v1/common.proto";

message Credential {
  string id = 1;          // proxy_credentials.id
  string account_id = 2;  // 用于流量归属
  bytes secret = 3;       // 按协议解释：UUID、密码等
  uint32 speed_limit_mbps = 4; // 0 表示不限
  int64 expires_at_ms = 5;     // 本地兜底：到期自动移除
}

message Inbound {
  string tag = 1;
  Protocol protocol = 2;
  uint32 listen_port = 3;
  bytes settings_json = 4; // 传输、TLS、Reality 等，结构见 spec/21
  uint64 version = 5;
}

message SyncFull {
  uint64 config_version = 1;
  KernelType kernel = 6; // 控制面为该节点选定的内核；与当前不同时 Agent 切换内核后再应用入站
  repeated Inbound inbounds = 2;
  repeated Credential credentials = 3;
  bytes routes_json = 4;
  bytes checksum = 5; // SHA-256，覆盖以上字段的规范序列化
}

message SyncDelta {
  uint64 from_version = 1;
  uint64 to_version = 2;
  repeated Credential upserts = 3;
  repeated string removals = 4;
}

message CredUpsert {
  uint64 config_version = 1;
  repeated Credential credentials = 2;
}

message CredRemove {
  uint64 config_version = 1;
  repeated string credential_ids = 2;
  bool close_sessions = 3;
}

message QuotaLease {
  string account_id = 1;
  int64 bytes = 2;       // 正数发放，0 表示回收全部
  string lease_id = 3;
  int64 expires_at_ms = 4;
}

message LeaseRequest {
  string account_id = 1;
  string current_lease_id = 2;
  int64 remaining_bytes = 3;
}

message InboundApply {
  uint64 config_version = 1;
  KernelType kernel = 3; // 同 SyncFull.kernel
  repeated Inbound inbounds = 2;
}

message RoutesApply {
  uint64 config_version = 1;
  bytes routes_json = 2;
  bytes dns_provider_secret = 3; // 已加密
}

message AgentUpgrade {
  string version = 1;
  string url = 2;
  bytes sha256 = 3;
  bytes signature = 4;
}

message TrafficItem {
  string credential_id = 1;
  uint64 raw_up = 2;
  uint64 raw_down = 3;
  repeated string source_prefixes = 4; // 仅第三方共用凭据：活跃来源地址前缀
}

message ReportTraffic {
  uint64 report_seq = 1;
  int64 window_start_ms = 2;
  int64 window_end_ms = 3;
  repeated TrafficItem items = 4;
}

message ReportStatus {
  double cpu_percent = 1;
  uint64 mem_used_bytes = 2;
  uint64 mem_total_bytes = 3;
  uint32 tcp_connections = 4;
  uint64 rx_bps = 5;
  uint64 tx_bps = 6;
  uint64 uptime_seconds = 7;
  uint64 config_version = 8;
  repeated InboundHealth inbounds = 9;
}

message InboundHealth {
  string tag = 1;
  bool listening = 2;
  string error = 3;
}
