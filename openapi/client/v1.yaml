          - new
          - renew
          - upgrade
          - downgrade_scheduled
          - downgrade_immediate
        list_price_minor:
          type: integer
          format: int64
        remaining_value_minor:
          type: integer
          format: int64
        discount_minor:
          type: integer
          format: int64
        credit_applied_minor:
          type: integer
          format: int64
        amount_due_minor:
          type: integer
          format: int64
        currency:
          type: string
        starts_at:
          type: string
          format: date-time
        expires_at_after:
          type:
          - string
          - 'null'
          format: date-time
