          type: integer
        bytes_per_cycle:
          type: integer
          format: int64
        device_limit:
          type: integer
        speed_limit_mbps:
          type:
          - integer
          - 'null'
        reset_policy:
          type: string
          enum:
          - purchase_anchor
          - calendar_month
          - never
        location_count:
          type: integer
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PlanPrice'
    Quote:
      type: object
      required:
